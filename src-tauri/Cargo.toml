[package]
name = "genmetric"
version = "0.1.0"
description = "Индексатор метрических книг"
authors = ["GenMetric"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: окно показывает сканы из папки дела на диске (10.10.2026).
tauri = { version = "2", features = ["protocol-asset"] }
# Системное окно «Выберите папку» — для папки сканов. Окно открывает Rust
# (команда scan_pick_dir): команд плагина у страницы нет, и папку он сам не
# разрешает — это делаем мы, без вложенных папок.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled: SQLite компилируется вместе с программой, системная библиотека
# не нужна ни на Windows, ни на macOS.
rusqlite = { version = "0.32", features = ["bundled"] }
# Логика без окна — запросы, нормализация, выгрузка в xlsx: отдельный крейт,
# его тесты идут в быстрой проверке конвейера без сборки Tauri.
genmetric-core = { path = "core" }

[workspace]
members = ["core"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# panic = "abort" здесь нет намеренно (06.10.2026): с ним паника при разборе
# битого файла Excel закрывала программу целиком, и перехватить её было
# нечем. Теперь паника разматывает стек — см. genmetric_core::guarded.
