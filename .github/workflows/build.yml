# Автоматическая сборка установщиков под Windows и macOS.
#
# Запускается после каждого изменения в main и вручную. Готовые файлы
# складываются в выпуск с постоянным тегом latest-test, чтобы ссылка для
# тестировщиков не менялась от сборки к сборке:
#
#   https://github.com/mikhailsharov-arch/GenMetric/releases/tag/latest-test
#
# Скомпилированные файлы в репозиторий не коммитятся: бинарники не сжимаются
# в истории git и за полгода еженедельных сборок раздули бы её до гигабайтов.
#
# Сначала идёт быстрая проверка на Linux: она ловит ошибки в базе и интерфейсе
# за пару минут, не тратя десять минут компиляции на Windows и macOS.

name: Сборка приложения

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Быстрая проверка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Собрать базу справочников
        run: python db/build_seed.py src-tauri/resources/seed.sqlite

      - name: Проверить базу
        run: python db/verify_seed.py src-tauri/resources/seed.sqlite

      - name: Проверить обновление базы у пользователя
        run: python db/test_upgrade.py

      - name: Проверить хранение настроек
        run: python db/test_settings.py

      - name: Проверить сохранение записей
        run: python db/test_entry.py

      - name: Проверить сверку имён и карточку НП
        run: python db/test_parse.py

      - name: Проверить подсказки
        run: python db/test_suggest.py

      - name: Проверить перенос архива подсказок из Excel
        run: python db/test_archive.py

      - name: Проверить стили
        run: python scripts/check_styles.py

      # Правило проекта: инцидент не закрыт, пока на него нет механической
      # проверки. Этот шаг не даёт вернуть то, что уже стоило людям времени.
      - name: Регресс-тесты по инцидентам
        run: python scripts/test_incidents.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Установить зависимости интерфейса
        run: npm ci

      - name: Проверить раскладку счёта по полу
        run: node --experimental-strip-types scripts/test_count.mjs

      - name: Проверить шаг по номеру страницы
        run: node --experimental-strip-types scripts/test_page.mjs

      - name: Собрать интерфейс
        run: npm run build

  build:
    name: ${{ matrix.title }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            title: Windows
            args: ""
            bundles: src-tauri/target/release/bundle
          - os: macos-latest
            title: macOS
            args: "--target universal-apple-darwin"
            bundles: src-tauri/target/universal-apple-darwin/release/bundle

    steps:
      - uses: actions/checkout@v5

      # --- база справочников ------------------------------------------------
      # Собирается из текстовых файлов db/seed/*.csv и кладётся в ресурсы
      # приложения. В репозитории готовой базы нет.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Собрать базу справочников
        run: python db/build_seed.py src-tauri/resources/seed.sqlite

      # --- интерфейс --------------------------------------------------------
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Установить зависимости интерфейса
        run: npm ci

      # --- сборка приложения ------------------------------------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Собрать установщик
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Показать, что получилось
        shell: bash
        run: find "${{ matrix.bundles }}" -type f \( -name "*.exe" -o -name "*.dmg" \) -print

      # --- сквозная проверка на настоящем Windows ---------------------------
      # 13.09.2026 Роман получил сборку, где кнопка «Загрузить архив» не
      # работала: сырое тело IPC на WebView2 не доходило. В песочнице такое
      # не воспроизвести, а петля через заказчика — сутки. Единственный
      # настоящий Windows с настоящим WebView2 у нас — этот раннер. Здесь
      # собранный genmetric.exe проходит путь Романа: дело, архив, запись.
      # Падает — выпуска не будет.
      - name: WebView2 Runtime на раннере
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Без WebView2 Runtime приложение не откроет окно вовсе. Edge-браузер
          # его не заменяет: WebView2 ищет только Runtime, Beta, Dev, Canary.
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path -LiteralPath $key) {
            Write-Host "WebView2 Runtime уже есть: $((Get-ItemProperty -LiteralPath $key).pv)"
          } else {
            Write-Host "WebView2 Runtime нет — ставлю Evergreen bootstrapper"
            Invoke-WebRequest -UseBasicParsing "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile webview2setup.exe
            Start-Process -Wait -FilePath .\webview2setup.exe -ArgumentList "/silent", "/install"
            if (Test-Path -LiteralPath $key) {
              Write-Host "Поставлен: $((Get-ItemProperty -LiteralPath $key).pv)"
            } else { throw "WebView2 Runtime не установился" }
          }

      - name: Скачать msedgedriver под установленный WebView2
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Версия WebView2 Runtime — из реестра; драйвер обязан совпадать по мажору.
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $ver = $null
          if (Test-Path -LiteralPath $key) { $ver = (Get-ItemProperty -LiteralPath $key).pv }
          if (-not $ver) {
            $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
            $ver = (Get-Item $edge).VersionInfo.ProductVersion
          }
          Write-Host "WebView2: $ver"
          $major = $ver.Split('.')[0]
          $urls = @(
            "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip"
          )
          try {
            Invoke-WebRequest -UseBasicParsing "https://msedgedriver.microsoft.com/LATEST_RELEASE_${major}_WINDOWS" -OutFile latest.txt
            # Ответ приходит в UTF-16 с BOM.
            $latest = [System.Text.Encoding]::Unicode.GetString([System.IO.File]::ReadAllBytes("latest.txt")).Trim([char]0xFEFF, ' ', "`r", "`n")
            Write-Host "Последний драйвер ветки ${major}: $latest"
            $urls += "https://msedgedriver.microsoft.com/$latest/edgedriver_win64.zip"
          } catch { Write-Host "LATEST_RELEASE не ответил: $_" }
          $got = $false
          foreach ($u in $urls) {
            try {
              Write-Host "Пробую $u"
              Invoke-WebRequest -UseBasicParsing $u -OutFile edgedriver.zip
              $got = $true; break
            } catch { Write-Host "  нет: $_" }
          }
          if (-not $got) { throw "msedgedriver для WebView2 $ver не скачался" }
          Expand-Archive edgedriver.zip -DestinationPath msedgedriver -Force
          & .\msedgedriver\msedgedriver.exe --version

      - name: Сквозная проверка (e2e) собранного приложения
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pip install selenium
          python scripts/e2e/make_archive.py "$pwd\e2e-archive.sqlite"
          $exe = "$pwd\src-tauri\target\release\genmetric.exe"
          if (-not (Test-Path $exe)) { throw "нет $exe" }
          # Приложение и msedgedriver запускает сам сценарий (подход «attach»);
          # журнал драйвера — в e2e-msedgedriver.log, при провале уходит артефактом.
          try {
            python scripts/e2e/windows.py $exe "$pwd\e2e-archive.sqlite" "$pwd\msedgedriver\msedgedriver.exe"
            if ($LASTEXITCODE -ne 0) { throw "сквозная проверка провалилась" }
          } finally {
            Get-Process genmetric -ErrorAction SilentlyContinue | Stop-Process -Force
            Get-Process msedgedriver -ErrorAction SilentlyContinue | Stop-Process -Force
            Write-Host "--- msedgedriver.log (хвост) ---"
            Get-Content e2e-msedgedriver.log -Tail 60 -ErrorAction SilentlyContinue
          }

      - name: Снимок провала e2e
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          if-no-files-found: ignore
          path: |
            e2e-failure.png
            e2e-msedgedriver.log

      - uses: actions/upload-artifact@v7
        with:
          name: genmetric-${{ matrix.title }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ matrix.bundles }}/nsis/*.exe
            ${{ matrix.bundles }}/dmg/*.dmg

  release:
    name: Выложить сборку для тестирования
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: files

      # 27.08.2026 к тестировщику ушёл выпуск без единого установщика, и конвейер
      # отрапортовал успех: шаги проверяли, что команда не упала, а не что
      # у человека есть что скачать. Отсюда три проверки ниже.
      - name: Собрать список файлов
        run: |
          mkdir -p out
          find files -type f \( -name "*.exe" -o -name "*.dmg" \) -exec cp {} out/ \;
          ls -la out
          WIN=$(find out -type f -name "*.exe" | wc -l)
          MAC=$(find out -type f -name "*.dmg" | wc -l)
          echo "установщиков: Windows $WIN, macOS $MAC"
          # Выкладывать нечего — это провал сборки, а не повод молча продолжить.
          [ "$WIN" -ge 1 ] || { echo "::error::Нет установщика Windows (.exe)"; exit 1; }
          [ "$MAC" -ge 1 ] || { echo "::error::Нет установщика macOS (.dmg)"; exit 1; }

      - name: Обновить выпуск latest-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Тег перевыпускается, чтобы ссылка для тестировщиков не менялась.
          # Удаление может не найти прежний выпуск — это нормально, но ошибку
          # самого создания глотать нельзя, поэтому || true стоит только здесь.
          gh release delete latest-test --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          NOTES="Собрано автоматически из коммита ${GITHUB_SHA:0:7} — $(date -u '+%d.%m.%Y %H:%M UTC').

          Установщики не подписаны цифровой подписью, поэтому Windows и macOS покажут предупреждение при запуске. Как его пройти — в инструкции: docs/установка.md

          Это сборка для проверки, а не рабочая версия."
          gh release create latest-test out/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Сборка для тестирования" \
            --notes "$NOTES"

      - name: Убедиться, что тестировщику есть что скачать
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Спрашиваем у GitHub, что лежит на странице выпуска. Проверять надо
          # не «команда вернула ноль», а то, что откроет человек по ссылке.
          sleep 5
          ASSETS=$(gh release view latest-test --repo "$GITHUB_REPOSITORY" \
                     --json assets --jq '.assets[].name')
          echo "на странице выпуска:"
          echo "$ASSETS" | sed 's/^/  /'
          echo "$ASSETS" | grep -q '\.exe$' \
            || { echo "::error::В выпуске latest-test нет установщика Windows"; exit 1; }
          echo "$ASSETS" | grep -q '\.dmg$' \
            || { echo "::error::В выпуске latest-test нет установщика macOS"; exit 1; }
          echo "Выпуск: https://github.com/$GITHUB_REPOSITORY/releases/tag/latest-test"
